[package]
name = "rigr"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
syn = { version = "2.0.66", features = ["full", "visit"] }
quote = "1.0.36"
anyhow = "1.0.86"
thiserror = "1.0.61"
proc-macro2 = "1.0.86"
proptest = "1.5.0"
rustpython-parser = "0.3.0"
reqwest = { version = "0.12.4", features = ["json"] }
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
dirs = "5.0.1"
toml = "0.8.8"
dialoguer = "0.11.0"
console = "0.15.7"
indicatif = "0.17.8"
walkdir = "2.4.0"
ignore = "0.4.22"
futures = "0.3.30"
chrono = { version = "0.4.38", features = ["serde"] }
regex = "1.11.0"
csv = "1.3.0"
quick-xml = { version = "0.31.0", features = ["serialize"] }
# Document parsing dependencies
docx-rs = "0.4.17"
lopdf = "0.33.0"
calamine = "0.25.0"
encoding_rs = "0.8.34"
# Git and URL handling dependencies
url = "2.5.4"
git2 = "0.19.0"
# Logging dependencies
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.16", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"
# Additional export format dependencies
rust_xlsxwriter = "0.70.0"
uuid = { version = "1.10.0", features = ["v4"] }
base64 = "0.22.1"

[dev-dependencies]
tokio-test = "0.4.4"
wiremock = "0.6.0"
tempfile = "3.20.0"
assert_matches = "1.5.0"
mockito = "1.5.0"
serial_test = "3.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true